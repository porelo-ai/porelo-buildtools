title: "A pinned download that its own address has not served within 10 of the rule's 15 minutes - a 5xx or no answer that lasts, a 4xx - is fetched from the organization's Artifactory, `porelo-files/pinned/<sha256>/<file name>`, without a token, until the 15 minutes are spent, and taken only when its digest matches, both in `pinned.sh` and in `porelo-machines jdk`; a wrong digest still fails at once, `PORELO_PINNED_MIRROR` names another mirror or, set empty, none, and the new `porelo-release pinned-mirror`, run by the Build's Publish job on main, uploads every file this repository pins that the mirror lacks."
type: added
