title: "`porelo-release issues` and `stories` go, with the Markdown issue index's rules: `check-citations` and `check-commits` read no issue index, story or `project.yml` and reach nothing over the network, and tell an issue number by its shape (one or two capitals and two or three digits) or as a GitHub reference (`porelo-ai/<repository>#<n>`, `GH-<n>`, an issue's address, and in a commit `#<n>`). The root's `issues/` and `stories/` are read like any other directory; a directory named `issues` below the root stays a test's fixture and is skipped. `check-providers` reads `issues/` too."
type: removed
