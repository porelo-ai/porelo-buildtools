# The GraalVM the CI snapshots pin, installed on a GitHub runner and checked against its digest - so a
# job compiles with the same JDK a leg builds with, and never with whatever release a moving name ('25')
# resolved to that day. The pin lives in machines/pom.xml and is moved by the Machine images
# workflow once a release is three days old.
#
# Bootstrapped from the runner's own Java 25 (JAVA_HOME_25_X64), which runs porelo-machines once to
# install the pinned one; nothing that JDK compiles is published. Needs the repository checked out.
#
# Also the shfmt porelo-parent pins (shfmt.version), which Spotless checks every *.sh against in validate and does not
# download: first, since even the GraalVM's installation runs 'validate', and the tree holds shell scripts.
#
# Each pinned download is cached by its digest and checked against it again after a hit, and tried again by the one
# rule in pinned.sh, which PinnedRetry in porelo-pinned-rule follows too.
name: Pinned GraalVM
description: Installs the GraalVM porelo-machines pins, checked against its digest, as JAVA_HOME for the rest of the job, and the pinned shfmt on the PATH.
# The key of each cache the job restored or saved, for the job that keeps only the newest entry of each (build.yml's
# prune): a job that fetches code holds no token that deletes. Empty where nothing was restored or saved.
outputs:
    maven:
        description: The key of the local Maven repository restored, or the one maven-cache-keep saves.
        value: ${{ steps.maven-unread.outputs.key }}
    # Restored, or saved by this job: a key missed and never saved names nothing, so no entry is deleted for it.
    wrapper:
        description: The key of the wrapper's Maven.
        value: >-
            ${{ steps.wrapper-cache.outputs.cache-matched-key
            || (steps.wrapper-save.outcome == 'success' && steps.wrapper-cache.outputs.cache-primary-key) || '' }}
    shfmt:
        description: The key of the pinned shfmt.
        value: >-
            ${{ steps.shfmt-cache.outputs.cache-matched-key
            || (steps.shfmt-save.outcome == 'success' && steps.shfmt-cache.outputs.cache-primary-key) || '' }}
    graalvm:
        description: The key of the pinned GraalVM.
        value: >-
            ${{ steps.graalvm-cache.outputs.cache-matched-key
            || (steps.graalvm-save.outcome == 'success' && steps.graalvm-cache.outputs.cache-primary-key) || '' }}
runs:
    using: composite
    steps:
        # The local Maven repository, restored by its prefix and never saved here: build.yml's build job saves it
        # with maven-cache-keep as its last step, holding only what it read, so old versions do not pile up.
        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: maven-cache
          with:
              path: ~/.m2/repository
              key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
              restore-keys: maven-${{ runner.os }}-

        # Every restored file is marked unread, at the epoch: the runner's relatime then records the first read of each,
        # and maven-cache-keep keeps only the files read after this step.
        - name: Mark the restored Maven repository unread
          id: maven-unread
          shell: bash
          env:
              HIT: ${{ steps.maven-cache.outputs.cache-hit }}
              KEY: ${{ steps.maven-cache.outputs.cache-primary-key }}
              MATCHED: ${{ steps.maven-cache.outputs.cache-matched-key }}
          run: |
              set -eu
              mkdir -p "$HOME/.m2/repository"
              {
                  echo "PORELO_MAVEN_CACHE_KEY=$KEY"
                  echo "PORELO_MAVEN_CACHE_HIT=${HIT:-false}"
                  echo "PORELO_MAVEN_CACHE_SINCE=$(date +%s)"
              } >> "$GITHUB_ENV"
              # The entry restored, which the prune keeps unless maven-cache-keep saves a newer one.
              echo "key=$MATCHED" >> "$GITHUB_OUTPUT"
              find "$HOME/.m2/repository" -type f -exec touch -a -d @0 {} +
              # A file beside the repository, read only before the save, says whether its file system records reads.
              touch "$HOME/.m2/porelo-atime-probe"
              touch -a -d @0 "$HOME/.m2/porelo-atime-probe"

        # The wrapper's Maven, fetched once per pin: without it every job fetched it with one wget and no retry, and a
        # single network hiccup failed a Build (2026-11-06). Saved once the wrapper ran, below.
        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: wrapper-cache
          with:
              path: ~/.m2/wrapper
              key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

        # Every pinned download is kept by its digest and checked again after a cache hit; pinned.sh beside this file
        # holds the one rule by which a download is tried again (about 15 minutes of pauses before red).
        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: shfmt-cache
          with:
              path: ~/.cache/porelo-pinned/shfmt
              key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

        # Spotless refuses an shfmt of another version than the parent pins, so a moved pin fails here loudly.
        - name: Install the pinned shfmt
          shell: bash
          env:
              # The job's token, for a download from https://github.com alone; none on a host's forge.
              PORELO_PINNED_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          run: |
              set -eu
              . "$GITHUB_ACTION_PATH/pinned.sh"
              VERSION=3.12.0
              pinned_fetch "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64" \
                  d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea \
                  "$HOME/.cache/porelo-pinned/shfmt/shfmt"
              mkdir -p "$RUNNER_TEMP/bin"
              install -m 0755 "$HOME/.cache/porelo-pinned/shfmt/shfmt" "$RUNNER_TEMP/bin/shfmt"
              echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

        - if: steps.shfmt-cache.outputs.cache-hit != 'true'
          id: shfmt-save
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/porelo-pinned/shfmt
              key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

        - name: The tools that install the pinned GraalVM, and its digest
          id: graalvm-pin
          shell: bash
          run: |
              set -eu
              . "$GITHUB_ACTION_PATH/pinned.sh"
              if [ -z "${JAVA_HOME_25_X64:-}" ]; then
                  echo "::error::this runner has no Java 25 to install the pinned GraalVM with (JAVA_HOME_25_X64)"
                  exit 1
              fi
              export JAVA_HOME="$JAVA_HOME_25_X64"
              # The wrapper fetches its Maven once, checks it against distributionSha256Sum and installs it only whole, so
              # asking it again after a failed fetch is a retry; a cached one answers at once.
              pinned_retry "the wrapper's Maven" ./mvnw -B -q --version >/dev/null
              ./mvnw -B -q -s settings.xml -pl machines -am install -DskipTests
              ./mvnw -B -q -s settings.xml -pl machines dependency:build-classpath \
                  -Dmdep.outputFile=target/jdk-cp.txt
              # A failure says so: set -e alone would end the step at this assignment without a word.
              sha256=$("$JAVA_HOME/bin/java" -cp "machines/target/classes:$(cat machines/target/jdk-cp.txt)" \
                  org.fuin.porelo.machines.Main jdk --print-sha256) \
                  || { echo "::error::porelo-machines could not name the pinned digest (exit $?)"; exit 1; }
              [[ $sha256 =~ ^[0-9a-f]{64}$ ]] \
                  || { echo "::error::porelo-machines named no pinned digest"; exit 1; }
              echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

        # The wrapper ran in the step above, so its Maven is there to keep.
        - if: steps.wrapper-cache.outputs.cache-hit != 'true'
          id: wrapper-save
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.m2/wrapper
              key: ${{ steps.wrapper-cache.outputs.cache-primary-key }}

        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: graalvm-cache
          with:
              path: ~/.cache/porelo-pinned/graalvm
              key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}

        - name: Install the pinned GraalVM
          shell: bash
          env:
              # The job's token, for a download from https://github.com alone; none on a host's forge.
              PORELO_PINNED_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          run: |
              set -eu
              "$JAVA_HOME_25_X64/bin/java" -cp "machines/target/classes:$(cat machines/target/jdk-cp.txt)" \
                  org.fuin.porelo.machines.Main jdk --github --cache "$HOME/.cache/porelo-pinned/graalvm"

        - if: steps.graalvm-cache.outputs.cache-hit != 'true'
          id: graalvm-save
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/porelo-pinned/graalvm
              key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}
