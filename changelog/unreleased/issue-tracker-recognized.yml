title: "The issue tools recognize a project whose `project.yml` names GitHub Issues as its tracker (`tracker: {kind: github}`), read from the nearest `project.yml` above the directory or else, in a checkout of a porelo-ai repository, from porelo-project's on GitHub, while any other directory, such as a test's fixture, keeps Markdown issues: `issues check`, `stories check` and `stage` then pass on purpose with one line, and `check-commits` and `check-pushes` read no `issues/` and tell an issue number by its shape, an old id or a GitHub reference; without a tracker nothing changes. `check-citations` also refuses `porelo-ai/<repository>#<n>`, `GH-<n>` and a porelo-ai issue's address."
type: added
