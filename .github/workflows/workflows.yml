# The light check of a pull request that changes only workflows, Dependabot's action moves above all: every step pinned,
# and every workflow a file GitHub can read. It builds the check tooling, rents nothing and publishes nothing; the
# registry token lets it resolve private snapshots. The Build leaves such a pull request to it.
name: Workflow check

on:
    pull_request:
        branches: ['**']
        paths: ['.github/**']

permissions:
    contents: read

jobs:
    check:
        name: Workflow check
        runs-on: ubuntu-26.04
        env:
            MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}
            PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
        timeout-minutes: 25
        steps:
            # A forge with no registry or no token for it would quietly read Sonatype's snapshots alone.
            - name: A forge names its registry and its token
              env:
                  SERVER_URL: ${{ github.server_url }}
              run: |
                  [ "$SERVER_URL" != 'https://github.com' ] || exit 0
                  [ -n "$MAVEN_SNAPSHOTS_URL" ] || { echo "::error::MAVEN_SNAPSHOTS_URL is empty on $SERVER_URL"; exit 1; }
                  [ -n "$PORELO_PACKAGES_READ_TOKEN" ] || { echo "::error::PORELO_PACKAGES_READ_TOKEN is empty on $SERVER_URL"; exit 1; }

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            - name: Every step pinned to a commit
              run: |
                  ./mvnw -B -q -s settings.xml -pl release -am install -DskipTests
                  ./mvnw -B -q -s settings.xml -pl release exec:java@check-actions

            # A file that does not load, or names no trigger or no job, is a workflow GitHub would not run.
            - name: Every workflow loads, with its triggers and jobs
              run: |
                  ./mvnw -B -q -s settings.xml -pl release dependency:build-classpath -Dmdep.outputFile=target/cp.txt
                  java -cp "release/target/classes:$(cat release/target/cp.txt)" org.fuin.porelo.release.Main \
                      check-workflows
