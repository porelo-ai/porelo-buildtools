# Checks the documents: AGENTS.md's shared block against its hash, no citation of an issue that goes stale, a
# documentation chapter somebody can find their way through, and on a pull request its commit messages. Of its own because the build ignores a change to Markdown
# alone, which is exactly the change this is for, and it leases no machine.
name: Shared rules check

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-26.04
        env:
            MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}
            PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # check-shared, check-citations, check-readmes, check-doc-site and check-providers are this repository's own,
            # so the tests that run them against it are the check: the ones tagged documents.
            - name: The documents
              run: ./mvnw -B -s settings.xml -Pdocuments test

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
              run: |
                  set -eu
                  # The checkout holds the merge commit alone; the range needs the history of both its sides.
                  if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                      git fetch --no-tags --quiet --unshallow origin "$PR_BASE" "$PR_HEAD"
                  else
                      git fetch --no-tags --quiet origin "$PR_BASE" "$PR_HEAD"
                  fi
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                  fi
                  # From this commit's own build, so the rule checked is the one beside it.
                  ./mvnw -B -q -s settings.xml -pl release -am install -DskipTests
                  ./mvnw -B -q -s settings.xml -pl release dependency:build-classpath -Dmdep.outputFile=target/cp.txt
                  java -cp "release/target/classes:$(cat release/target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside
